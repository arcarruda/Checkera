name: Checkera
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: "complete"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Checkera:
    type: application
    platform: iOS
    sources:
      - path: Checkera
    info:
      path: Checkera/Info.plist
      properties:
        CFBundleDisplayName: Checkera
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: app.topera.checkera
            CFBundleURLSchemes:
              - checkera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.topera.checkera
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Checkera/Checkera.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - target: CheckeraWidget
        embed: true
  CheckeraWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CheckeraWidget
      - path: Checkera/Models/DailyTask.swift
      - path: Checkera/Models/TaskStatus.swift
      - path: Checkera/Models/TaskType.swift
      - path: Checkera/Models/SleepWindow.swift
      - path: Checkera/Models/TaskSnapshot.swift
      - path: Checkera/Persistence/PersistenceController.swift
      - path: Checkera/Resources
    info:
      path: CheckeraWidget/Info.plist
      properties:
        CFBundleDisplayName: Checkera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.topera.checkera.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: CheckeraWidget/CheckeraWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CheckeraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CheckeraTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.topera.checkera.tests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Checkera.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Checkera
    dependencies:
      - target: Checkera
schemes:
  Checkera:
    build:
      targets:
        Checkera: all
        CheckeraWidget: all
        CheckeraTests: [test]
    test:
      targets:
        - CheckeraTests
